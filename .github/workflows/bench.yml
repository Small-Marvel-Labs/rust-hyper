name: Benchmark
on:
  push:
    branches:
      - master

jobs:
  benchmark:
    name: Benchmark
    runs-on: [self-hosted, Linux, X64, linux-ci]
    strategy:
      matrix:
        bench:
          - end_to_end
          - pipeline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      # Run benchmark and stores the output to a file
      - name: Run benchmark
        run: cargo bench --features full --bench ${{ matrix.bench }} | tee output.txt

      # Download previous benchmark result from cache (if exists)
      - name: Download previous benchmark data
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark

      # Run `github-action-benchmark` action
      - name: Store benchmark result
        uses: seanmonstar/github-action-benchmark@a20887d1e21bc9d781e6883a97a491ab6c840efe
        with:
          name: ${{ matrix.bench }}
          # What benchmark tool the output.txt came from
          tool: 'cargo'
          # Where the output from the benchmark tool is stored
          output-file-path: output.txt
          # # Where the previous data file is stored
          # external-data-json-path: ./cache/benchmark-data.json
          # Workflow will fail when an alert happens
          fail-on-alert: true
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Enable alert commit comment
          comment-on-alert: true
          #alert-comment-cc-users: '@seanmonstar'
          auto-push: true

      # Upload the updated cache file for the next job by actions/cache
